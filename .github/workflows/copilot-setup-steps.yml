name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".azldev-version"
      - ".github/workflows/containers/azldev-runner.Dockerfile"
      - ".github/workflows/containers/copilot-*"
      - "scripts/copilot/**"
      - ".github/workflows/copilot-setup-steps.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  copilot-setup-steps:
    name: "Prepare azldev container"
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build azldev runner container
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < .azldev-version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9A-Za-z._+-]+$'; then
            echo "::error::.azldev-version is empty or contains unexpected characters"
            exit 1
          fi
          docker build \
            --build-arg UID="$(id -u)" \
            --build-arg AZLDEV_VERSION="$version" \
            -t localhost/azldev-runner \
            -f .github/workflows/containers/azldev-runner.Dockerfile \
            .github/workflows/containers/

      - name: Build non-root session image
        run: |
          set -euo pipefail
          docker build \
            --build-arg AZLDEV_VERSION="$(tr -d '\n' < .azldev-version)" \
            -t localhost/copilot-ci \
            -f .github/workflows/containers/copilot-ci.Dockerfile \
            .github/workflows/containers/

      - name: Confirm azldev can load the project
        run: |
          set -euo pipefail
          bash scripts/copilot/run.sh readiness

      - name: Record the session execution path
        run: |
          set -euo pipefail
          {
            echo '## Azure Linux cloud-session spike'
            echo
            echo 'Image: `localhost/copilot-ci`, derived from the pinned azldev runner.'
            echo 'Host: `bash scripts/copilot/run.sh azldev comp list -p dos2unix -q -O json`.'
            echo 'Host smoke-test: `bash scripts/copilot/run.sh mock-shell --add-package /workdir/base/out/rpms/<channel>/<package>.rpm -- <command>`.'
            echo
            echo 'For builds and mock tests, bind-mount the checkout at `/workdir`,'
            echo 'preserve stdin with `-i`, and use `--cap-add=SYS_ADMIN`,'
            echo '`--security-opt seccomp=unconfined`, and'
            echo '`--security-opt apparmor=unconfined`.'
            echo
            echo 'Trust is read at command time after firewall CA injection, not baked into the image.'
            echo 'Setup readiness does not build or smoke-test an RPM.'
          } >> "$GITHUB_STEP_SUMMARY"
