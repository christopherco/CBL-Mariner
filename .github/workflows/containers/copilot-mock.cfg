import hashlib
import re

# Mock loads this user config after the caller's selected distro config.
# Read session trust at mock invocation time, never at image build time.
_ca_source = '/etc/ssl/certs/ca-certificates.crt'
try:
    with open(_ca_source) as _ca_file:
        _ca = _ca_file.read()
except OSError as _error:
    raise RuntimeError('Cannot read current-session CA bundle: ' + _ca_source) from _error
if '-----BEGIN CERTIFICATE-----' not in _ca:
    raise RuntimeError('Copilot session CA bundle is missing certificates')
_ca_digest = hashlib.sha256(_ca.encode()).hexdigest()
_ca_target = '/etc/copilot-session/proxy-ca-' + _ca_digest + '.pem'

# Initialized roots skip auxiliary-file provisioning. Isolate roots and root
# caches as well as filenames so restored state cannot retain another CA.
config_opts['root'] += '-copilot-' + _ca_digest
for _key in ('rootdir', 'bootstrap_root'):
    if _key in config_opts and '{{root}}' not in config_opts[_key]:
        config_opts[_key] = config_opts[_key].rstrip('/') + '-copilot-' + _ca_digest
_cache = config_opts['plugin_conf']['root_cache_opts']
if '{{root}}' not in _cache['dir']:
    _cache['dir'] = _cache['dir'].rstrip('/') + '-copilot-' + _ca_digest


def _trusted_config(text, ca_path):
    if '[main]' not in text:
        raise RuntimeError('Copilot session requires a mock DNF [main] config')
    # Replace only trust settings, including repo-level overrides.
    text = re.sub(r'(?m)^\s*(?:sslcacert|sslverify)\s*=.*\n?', '', text)
    return re.sub(
        r'(?m)^(\[[^\n]+\])',
        lambda match: match.group(1) + '\nsslcacert=' + ca_path + '\nsslverify=1\n',
        text,
    )


_dnf = config_opts['dnf.conf']
config_opts['bootstrap_dnf.conf'] = _trusted_config(
    config_opts.get('bootstrap_dnf.conf', _dnf), _ca_source,
)
config_opts['dnf.conf'] = _trusted_config(_dnf, _ca_target)
config_opts['files'][_ca_target.lstrip('/')] = _ca
config_opts['dnf5_common_opts'] += [
    '--setopt=sslcacert=' + _ca_target,
    '--setopt=sslverify=1',
]
